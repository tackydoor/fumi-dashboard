<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyDashboard</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%8A%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <h1 class="brand">MyDashboard</h1>
    <div class="topbar-actions">
      <button type="button" class="icon-btn" id="btn-refresh" title="すべて更新" aria-label="すべて更新">⟳</button>
      <button type="button" class="icon-btn" id="btn-fullscreen" title="全画面表示" aria-label="全画面表示">⛶</button>
      <button type="button" class="icon-btn" id="btn-settings" title="設定" aria-label="設定">⚙</button>
    </div>
  </header>

  <main class="grid">
    <!-- 時計 -->
    <section class="card clock" aria-label="現在時刻">
      <div class="clock-date">
        <span id="clock-ymd">----年--月--日</span>
        <span id="clock-wday" class="wday">（-）</span>
      </div>
      <div class="clock-time" aria-live="off">
        <span id="clock-hm">--:--</span><span class="clock-sec">:<span id="clock-s">--</span></span>
      </div>
      <div class="clock-sub">
        <span id="clock-era"></span>
        <span id="clock-holiday" class="holiday"></span>
      </div>
    </section>

    <!-- 現在の天気 -->
    <section class="card now" aria-label="現在の天気">
      <div class="card-head">
        <h2>現在の天気</h2>
        <span class="loc" id="loc-name">📍 位置情報を取得中…</span>
      </div>
      <div class="now-body">
        <div class="now-icon" id="now-icon">…</div>
        <div class="now-main">
          <div class="now-temp"><span id="now-temp">--</span><span class="unit">℃</span></div>
          <div class="now-desc" id="now-desc">&nbsp;</div>
          <div class="now-hilo">最高 <b class="hi" id="now-hi">--</b> / 最低 <b class="lo" id="now-lo">--</b></div>
        </div>
        <dl class="now-stats" id="now-stats"></dl>
      </div>
      <div class="card-foot" id="weather-status"></div>
    </section>

    <!-- 時間ごとの予報 -->
    <section class="card hourly-card" aria-label="直近の天気予報">
      <div class="card-head"><h2>直近12時間の予報</h2></div>
      <div class="hourly" id="hourly"></div>
    </section>

    <!-- 週間予報 -->
    <section class="card weekly-card" aria-label="週間天気予報">
      <div class="card-head"><h2>週間天気予報</h2></div>
      <div class="weekly" id="weekly"></div>
    </section>

    <!-- ニュース -->
    <section class="card news-card" aria-label="ニュース" id="news-card">
      <div class="card-head">
        <h2>ニュース</h2>
        <span class="muted small" id="news-status"></span>
      </div>
      <div class="tabs" id="news-tabs" role="tablist"></div>
      <ol class="news-list" id="news-list"></ol>
    </section>

    <!-- 株価 -->
    <section class="card market-card" aria-label="株価・マーケット">
      <div class="card-head">
        <h2>マーケット</h2>
        <div class="seg" id="market-range" role="group" aria-label="期間">
          <button type="button" data-range="1D">1日</button>
          <button type="button" data-range="1M">1か月</button>
          <button type="button" data-range="12M">1年</button>
        </div>
      </div>
      <div class="market-main" id="market-main"></div>
      <div class="market-tiles" id="market-tiles"></div>
      <p class="card-foot">
        ※ 日経平均（現物指数）はチャート提供元の配信制限があるため先物を表示しています。
        <a href="https://indexes.nikkei.co.jp/nkave" target="_blank" rel="noopener">日経平均の公式値</a> ／
        Charts by <a href="https://jp.tradingview.com/" target="_blank" rel="noopener">TradingView</a>
      </p>
    </section>
  </main>

  <!-- 設定ダイアログ -->
  <dialog id="settings-dialog" class="settings">
    <form method="dialog" id="settings-form">
      <header class="settings-head">
        <h2>設定</h2>
        <button type="button" class="icon-btn" data-act="close" aria-label="閉じる">✕</button>
      </header>
      <div class="settings-body" id="settings-body"></div>
      <footer class="settings-foot">
        <button type="button" class="btn ghost" data-act="reset">初期設定に戻す</button>
        <span class="spacer"></span>
        <button type="button" class="btn" data-act="close">キャンセル</button>
        <button type="button" class="btn primary" data-act="save">保存</button>
      </footer>
    </form>
  </dialog>

  <script src="js/config.js"></script>
  <script src="js/util.js"></script>
  <script src="js/clock.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/news.js"></script>
  <script src="js/market.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
